<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0">
  <title>9 月高班評估輕鬆溫習小樂園｜奧特曼主題溫習</title>
  <style>
    :root{--navy:#102a56;--blue:#1769d2;--blue-dark:#0d438f;--red:#c9283d;--yellow:#ffd85a;--ink:#183153;--muted:#5b6b82;--white:#fff;--shadow:0 12px 28px rgba(13,67,143,.14)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    body{min-height:100vh;padding:18px 12px 32px;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(255,216,90,.42) 0 5px,transparent 6px),radial-gradient(circle at 88% 18%,rgba(232,61,79,.18) 0 7px,transparent 8px),linear-gradient(145deg,#f4fbff 0%,#fff8ef 52%,#eef5ff 100%)}
    body:before,body:after{content:"✦";position:fixed;color:rgba(23,105,210,.13);font-size:88px;pointer-events:none;z-index:-1}body:before{left:2%;top:42%;transform:rotate(-15deg)}body:after{right:3%;bottom:12%;transform:rotate(18deg)}
    .banner{max-width:1000px;margin:0 auto 16px;min-height:190px;padding:22px 60px 18px;text-align:center;position:relative;overflow:hidden;border:4px solid var(--navy);border-radius:30px;background:linear-gradient(135deg,#1769d2 0%,#2689ee 58%,#3b9ddd 100%);box-shadow:0 10px 0 #0b3d83,var(--shadow);isolation:isolate}
    .banner:before{content:"";position:absolute;width:240px;height:240px;right:-70px;top:-110px;border:26px solid rgba(255,255,255,.2);border-radius:50%;z-index:-1}.banner:after{content:"✦  ✧  ✦  ✧  ✦";position:absolute;left:0;right:0;bottom:10px;color:rgba(255,255,255,.42);letter-spacing:18px;font-size:13px}
    .ultra-svg{width:82px;height:82px;filter:drop-shadow(0 5px 0 rgba(13,67,143,.35));animation:bounceIn 1.2s ease-out}.ultra-float{position:absolute;width:48px;height:48px;filter:drop-shadow(0 4px 0 rgba(13,67,143,.25));animation:float 3s ease-in-out infinite alternate}
    @keyframes bounceIn{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}@keyframes float{0%{transform:translateY(0) rotate(-6deg)}100%{transform:translateY(-10px) rotate(6deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes starFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.15)}}
    h1{position:relative;z-index:1;color:#fff;font-size:clamp(22px,4vw,34px);line-height:1.35;letter-spacing:.04em;text-shadow:0 3px 0 var(--navy);margin:8px 0 3px}.banner-kicker{position:relative;z-index:1;color:#dff3ff;font-size:12px;font-weight:900;letter-spacing:.2em}.banner-subtitle{position:relative;z-index:1;color:#fff;font-size:14px;font-weight:700;opacity:.95}h2{display:flex;align-items:center;gap:8px;color:var(--navy);font-size:clamp(19px,3vw,25px);line-height:1.35}
    .tab-wrap{max-width:1000px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:9px}.tab-btn{min-height:52px;padding:10px 8px;border:3px solid var(--navy);border-radius:17px;background:var(--white);color:var(--navy);font-size:14px;font-weight:800;cursor:pointer;transition:transform .2s,background .2s,color .2s,box-shadow .2s;box-shadow:0 5px 0 #b6c9e3}.tab-btn:hover{transform:translateY(-3px);background:#fff4bc}.tab-btn.active{color:#fff;background:var(--red);border-color:#a91e32;box-shadow:0 5px 0 #a91e32;transform:translateY(-2px)}
    .panel{max-width:1000px;margin:0 auto;padding:22px;border:3px solid #d2e4fa;border-radius:26px;background:rgba(255,255,255,.94);display:none;animation:fadeIn .4s ease;box-shadow:var(--shadow)}.panel.show{display:block}
    .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat-item{flex:1;min-width:150px;padding:13px 10px;border:2px solid #c7def7;border-radius:17px;background:linear-gradient(135deg,#f4fbff,#e4f2ff);text-align:center;font-size:15px;font-weight:800;color:var(--blue-dark);box-shadow:0 5px 0 #d8e9f9}.checkin-wrap{display:flex;gap:9px;margin:14px 0 18px;justify-content:center}.checkin-dot{width:34px;height:34px;border-radius:50%;border:3px solid #bfd0e5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#8292aa;background:#f9fcff}.checkin-dot.done{color:#fff;background:var(--red);border-color:#a91e32;box-shadow:0 3px 0 #a91e32}
    .level-box{position:relative;margin:18px 0;padding:22px 18px;border:3px solid var(--yellow);border-radius:24px;background:linear-gradient(145deg,#fffdf5,#fff5c9);box-shadow:0 7px 0 #efc93f}.level-box:before{content:"✦";position:absolute;right:16px;top:8px;color:#f3b900;font-size:26px}.level-title{margin-bottom:9px;color:var(--blue-dark);font-size:16px;font-weight:800}.q-index{display:inline-block;margin-bottom:9px;padding:5px 11px;border-radius:99px;background:var(--red);color:#fff;font-size:14px;font-weight:800}.question-text{min-height:32px;margin:8px 0 18px;color:var(--navy);font-size:clamp(20px,4vw,27px);font-weight:800;line-height:1.5}.q-icon-block{text-align:center;margin:8px 0 18px;padding:10px}.q-icon-main{width:106px;height:106px;filter:drop-shadow(0 5px 0 rgba(23,105,210,.18))}
    .choice-btn{width:100%;min-height:56px;margin:6px 0;padding:13px 14px;border:3px solid #2472cf;border-radius:17px;background:#fff;color:var(--navy);font-size:18px;font-weight:800;cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s;box-shadow:0 4px 0 #a9c9ed}.choice-btn:hover{transform:translateY(-3px);background:#eaf5ff;box-shadow:0 7px 0 #a9c9ed}.choice-btn:active{transform:translateY(1px);box-shadow:0 2px 0 #a9c9ed}.tip-box{margin:16px 0 0;padding:14px 16px;border:2px dashed #efc93f;border-radius:17px;background:#fff9dc;color:#755900;font-size:15px;font-weight:700}.empty-hint{margin:28px 0;color:var(--muted);font-size:16px;text-align:center}.lock-notice{margin:14px 0;padding:15px;border:2px solid #f29aa6;border-radius:17px;background:#fff0f2;color:#b12539;font-weight:800;text-align:center}.danger-btn{background:#fff0f2!important;border-color:#d94358!important;color:#b12539!important;box-shadow:0 4px 0 #efb4bd!important}
    .feedback-layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(16,42,86,.3);opacity:0;visibility:hidden;pointer-events:none;z-index:99;transition:opacity .2s ease,visibility .2s ease}.feedback-layer.open{opacity:1;visibility:visible;pointer-events:auto}.feedback-box{width:min(100%,360px);padding:26px 24px;border:4px solid var(--navy);border-radius:26px;background:rgba(255,255,255,.98);text-align:center;transform:scale(.8) translateY(12px);transition:transform .25s ease;box-shadow:0 9px 0 var(--yellow),0 18px 30px rgba(13,67,143,.2)}.feedback-layer.open .feedback-box{transform:scale(1) translateY(0)}.feedback-box img{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 10px}.feedback-box h3{color:var(--red);font-size:21px;line-height:1.45}.feedback-close{width:100%;margin-top:16px;padding:10px 14px;border:2px solid var(--blue);border-radius:14px;background:#eaf5ff;color:var(--navy);font-size:16px;font-weight:800;cursor:pointer}.star{position:absolute;width:22px;height:22px;background:var(--yellow);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:starFly 1.1s ease-out forwards}
    .game-stage{margin-top:18px;padding:18px;border:3px solid #a9c9ed;border-radius:22px;background:#f8fcff;text-align:center}.game-stage svg{max-width:100%;height:auto;touch-action:none}.game-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}.game-actions .choice-btn{width:auto;min-width:150px}.game-message{min-height:28px;margin-top:12px;color:var(--red);font-size:18px;font-weight:900}.memory-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.memory-options .choice-btn{min-width:0;font-size:26px}
    @media (max-width:900px){.tab-wrap{grid-template-columns:repeat(4,minmax(0,1fr))}}@media (max-width:620px){body{padding:10px 8px 24px}.banner{min-height:170px;padding:18px 42px 16px;border-radius:24px}.ultra-svg{width:70px;height:70px}.ultra-float{width:38px;height:38px}.tab-wrap{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab-btn{min-height:48px;font-size:13px}.panel{padding:16px;border-radius:22px}.level-box{padding:18px 14px}.memory-options{grid-template-columns:repeat(2,1fr)}}@media (max-width:390px){.banner{padding-left:30px;padding-right:30px}.ultra-float{display:none}.tab-btn{font-size:12px}.stat-item{min-width:125px;font-size:13px}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="banner">
    <svg class="ultra-float" style="top:8px;left:12px" viewBox="0 0 100 100"><circle cx="50" cy="32" r="22" fill="#f0f0f0"/><circle cx="42" cy="28" r="4" fill="red"/><circle cx="58" cy="28" r="4" fill="red"/><path d="M30 54 Q50 46 70 54 L64 88 L36 88 Z" fill="#ef4444"/><path d="M38 56 L62 56 L58 82 L42 82 Z" fill="#f8f8f8"/></svg>
    <svg class="ultra-svg" viewBox="0 0 100 100"><circle cx="50" cy="32" r="22" fill="#f0f0f0"/><circle cx="42" cy="28" r="4" fill="red"/><circle cx="58" cy="28" r="4" fill="red"/><path d="M30 54 Q50 46 70 54 L64 88 L36 88 Z" fill="#ef4444"/><path d="M38 56 L62 56 L58 82 L42 82 Z" fill="#f8f8f8"/></svg>
    <svg class="ultra-float" style="top:8px;right:12px;animation-delay:.8s" viewBox="0 0 100 100"><circle cx="50" cy="32" r="22" fill="#f0f0f0"/><circle cx="42" cy="28" r="4" fill="red"/><circle cx="58" cy="28" r="4" fill="red"/><path d="M30 54 Q50 46 70 54 L64 88 L36 88 Z" fill="#ef4444"/><path d="M38 56 L62 56 L58 82 L42 82 Z" fill="#f8f8f8"/></svg>
    <p class="banner-kicker">ULTRA STUDY MISSION · K3</p><h1>高班評估輕鬆溫習小樂園<br>奧特曼陪我溫書✨</h1><p class="banner-subtitle">每日完成 5 題，收集你的學習能量！</p>
  </div>

  <div class="tab-wrap">
    <button class="tab-btn active" data-target="tab-ultraman-knowledge">奧特曼知識(30題)</button><button class="tab-btn" data-target="tab-ultraman-image-quiz">圖片猜奧特曼(30題)</button><button class="tab-btn" data-target="tab-chinese">中文(30題)</button><button class="tab-btn" data-target="tab-math">數學(30題)</button><button class="tab-btn" data-target="tab-eng-vocab">Eng-Vocab(30題)</button><button class="tab-btn" data-target="tab-eng-sent">Eng - 句型(30題)</button><button class="tab-btn" data-target="tab-mandarin">普通話(30題)</button><button class="tab-btn" data-target="tab-all-mistake">綜合錯題練習</button><button class="tab-btn" data-target="tab-game">🎮專注力小遊戲</button>
  </div>
  <main id="subject-panels"></main>

  <section class="panel" id="tab-all-mistake">
    <h2>🔧 綜合錯題練習（全部科目）</h2><div class="stat-row"><div class="stat-item">錯題總數：<span id="allmistake-count">0</span></div></div>
    <div id="allmistake-empty" class="empty-hint">暫時沒有錯題，多做練習就會出現✨奧特曼等你挑戰</div>
    <div class="level-box" id="allmistake-wrap" style="display:none"><div class="level-title">科目：<span id="allmistake-subject"></span></div><div class="q-index" id="allmistake-qidx"></div><div class="q-icon-block" id="allmistake-icon"></div><div class="question-text" id="allmistake-q"></div><div id="allmistake-opt"></div></div>
    <button class="choice-btn" id="allmistake-clear" style="margin-top:10px;background:#ffddcc">清空全部錯題本</button><button class="choice-btn danger-btn" id="reset-all-progress" style="margin-top:8px">⚠️重置全部練習進度</button>
  </section>

  <section class="panel" id="tab-game">
    <h2>🎮 專注力小遊戲</h2>
    <div class="stat-row"><div class="stat-item">已完成錯題練習：<span id="mistake-practice-count">0</span> 次</div><div class="stat-item">已解鎖遊戲：<span id="unlock-game-count">0</span> 個</div></div>
    <div id="game-content"></div>
  </section>

  <div class="feedback-layer" id="feedback-layer" role="dialog" aria-modal="true" aria-live="polite"><div class="feedback-box"><img id="feedback-image" src="./assets/success.png" width="84" height="84" alt=""><h3 id="feedback-text">太棒啦，相信光，沖啊✨</h3><button class="feedback-close" id="feedback-close" type="button">知道了</button></div></div>

  <script>
    const PER_DAY=5,TOTAL_DAY=6,STORAGE_KEY="kindergarten_study_data";
    const SUBJECTS={ultramanKnowledge:{label:"奧特曼知識",title:"奧特曼知識(30題)",dataKey:"ultramanKnowledge"},ultramanImageQuiz:{label:"圖片猜奧特曼",title:"圖片猜奧特曼(30題)",dataKey:"ultramanImageQuiz"},chinese:{label:"中文",title:"📖 中文溫習",dataKey:"chinese"},math:{label:"數學",title:"🔢 數學溫習",dataKey:"math"},vocab:{label:"Eng‑Vocab",title:"🔤 English Vocab",dataKey:"vocab"},engsent:{label:"Eng‑句型",title:"🔤 English句型",dataKey:"engsent"},mandarin:{label:"普通話",title:"🎤 普通話溫習",dataKey:"mandarin"}};
    const GAME_NAMES=["迷宮遊戲","找不同遊戲","視覺記憶遊戲","數字記憶遊戲","圖形規律遊戲","反應訓練遊戲"];
    let quizData={},quizDataReady=false,mistakeCursor=0,mistakeLocalList=[],gameTimer;

    function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function getTodayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
    function subjectState(){return {pool:shuffle([...Array(30).keys()]),day:1,todayDone:0,pos:0,modeMap:{},assessmentUnlocked:false,assessmentMode:false,assessmentQueue:[],assessmentIndex:0,assessmentScore:0}}
    function getDefaultData(){return {version:null,lastDate:getTodayStr(),dailyPracticeCount:0,mistakePracticeCompleteCount:0,unlockGameCount:0,game:{date:getTodayStr(),cycleDay:1,unlocked:false,completed:false},globalMistake:[],...Object.fromEntries(Object.keys(SUBJECTS).map(k=>[k,subjectState()]))}}
    function loadStorage(){let data;try{data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){data=null}if(!data)data=getDefaultData();if(!Number.isFinite(Number(data.mistakePracticeCompleteCount)))data.mistakePracticeCompleteCount=0;data.mistakePracticeCompleteCount=Math.max(0,Math.floor(Number(data.mistakePracticeCompleteCount)));data.unlockGameCount=data.mistakePracticeCompleteCount;Object.keys(SUBJECTS).forEach(k=>{if(!data[k])data[k]=subjectState();if(!data[k].modeMap)data[k].modeMap={};if(!Array.isArray(data[k].assessmentQueue))data[k].assessmentQueue=[]});if(!Array.isArray(data.globalMistake))data.globalMistake=[];if(!data.game)data.game={date:getTodayStr(),cycleDay:1,unlocked:false,completed:false};if(data.lastDate!==getTodayStr()){data.lastDate=getTodayStr();data.dailyPracticeCount=0;Object.keys(SUBJECTS).forEach(k=>{data[k].todayDone=0;data[k].modeMap={};data[k].assessmentMode=false;data[k].assessmentQueue=[];data[k].assessmentIndex=0;data[k].assessmentScore=0});data.game={date:getTodayStr(),cycleDay:(Number(data.game.cycleDay||1)%6)+1,unlocked:false,completed:false}}return data}
    let appData=loadStorage();
    function saveStorage(){localStorage.setItem(STORAGE_KEY,JSON.stringify(appData))}
    function renderCheckin(id,day){const el=document.getElementById(id);el.innerHTML="";for(let i=1;i<=TOTAL_DAY;i++){const dot=document.createElement("div");dot.className="checkin-dot"+(i<=Math.min(day,TOTAL_DAY)?" done":"");dot.textContent=i;el.appendChild(dot)}}
    let feedbackCloseHandler=()=>{},feedbackTimer;
    function speakText(text){if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window))return;const synthesis=window.speechSynthesis;synthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);const voices=synthesis.getVoices();const chineseVoices=voices.filter(voice=>/^zh(-|_|$)/i.test(voice.lang));const maleVoice=chineseVoices.find(voice=>/(male|男|yunyang|yunxi|xiaoyu|xiaoxiao)/i.test(voice.name));utterance.voice=maleVoice||chineseVoices[0]||voices[0]||null;utterance.lang=(utterance.voice&&utterance.voice.lang)||"zh-CN";utterance.rate=.9;synthesis.speak(utterance)}
    function playEnglishVoice(text){if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window))return;const synthesis=window.speechSynthesis;synthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);const voices=synthesis.getVoices();const englishVoices=voices.filter(voice=>/^en(-|_|$)/i.test(voice.lang));const chosen=englishVoices.find(v=>/US|UK|en-US|en-GB/i.test(v.lang+" "+v.name))||englishVoices[0]||voices[0]||null;utterance.voice=chosen;utterance.lang=(chosen&&chosen.lang)||"en-US";utterance.rate=.8;synthesis.speak(utterance)}
    function closeFeedback(){clearTimeout(feedbackTimer);const layer=document.getElementById("feedback-layer");layer.classList.remove("open");const next=feedbackCloseHandler;feedbackCloseHandler=()=>{};next()}
    function showFeedback(kind,onClose){const isSuccess=kind==="success";const layer=document.getElementById("feedback-layer");document.getElementById("feedback-image").src=isSuccess?"./assets/success.png":"./assets/fail.png";document.getElementById("feedback-image").alt=isSuccess?"答對成功":"答錯鼓勵";document.getElementById("feedback-text").textContent=isSuccess?"太棒啦，相信光，沖啊✨":"加油，奧特曼相信你💪";document.getElementById("feedback-close").textContent=isSuccess?"繼續挑戰":"再試一次";feedbackCloseHandler=onClose||(()=>{});layer.classList.add("open");if(isSuccess)spawnStars();speakText(isSuccess?"相信光，奧特曼為你加油":"太可惜了，再來一次吧");if(isSuccess)feedbackTimer=setTimeout(closeFeedback,1200)}
    function showAssessmentFeedback(score,total){const text=`模擬9月評估：${score}/${total}，${score>=Math.ceil(total*0.7)?"表現很好，繼續保持！":"再多聽一遍英文吧，奧特曼陪你加油！"}`;document.getElementById("feedback-image").src=score>=Math.ceil(total*0.7)?"./assets/success.png":"./assets/fail.png";document.getElementById("feedback-text").textContent=text;document.getElementById("feedback-close").textContent="完成";document.getElementById("feedback-layer").classList.add("open");feedbackCloseHandler=()=>{};speakText(score>=Math.ceil(total*0.7)?"模擬評估完成，表現很好":"模擬評估完成，再多聽一遍英文吧")} 
    function spawnStars(){for(let i=0;i<12;i++){const s=document.createElement("div");s.className="star";s.style.setProperty("--tx",(Math.random()*220-110)+"px");s.style.setProperty("--ty",(Math.random()*-150-35)+"px");s.style.left="50%";s.style.top="50%";document.getElementById("feedback-layer").appendChild(s);setTimeout(()=>s.remove(),1100)}}
    function markPractice(){appData.dailyPracticeCount=(appData.dailyPracticeCount||0)+1;saveStorage();updateGameUnlock()}
    function subjectPanel(key){const s=SUBJECTS[key];const panelId=key==="vocab"?"eng-vocab":key==="engsent"?"eng-sent":key==="mandarin"?"mandarin":key==="ultramanKnowledge"?"ultraman-knowledge":key==="ultramanImageQuiz"?"ultraman-image-quiz":key;const tip=(key==="vocab"||key==="engsent")?"多聽英文，認識單詞與圖片✨奧特曼陪你學習":(key==="ultramanKnowledge"||key==="ultramanImageQuiz")?"多看多猜奧特曼故事，勇敢挑戰超級英雄✨":"💡答對自動下一題；答錯可以再選答案｜奧特曼為你打氣！";return `<section class="panel${key==="chinese"?" show":""}" id="tab-${panelId}"><h2>${s.title}｜每日5題・6天打卡</h2><div class="stat-row"><div class="stat-item">今日完成：<span id="${key}-today">0</span>/5</div><div class="stat-item">當前第 <span id="${key}-day">1</span> /6 天</div></div><div class="checkin-wrap" id="${key}-checkin"></div><div id="${key}-lock" class="lock-notice" style="display:none">🔒今天挑戰已完成！下一次挑戰請明天開始</div><div class="level-box"><div class="q-index" id="${key}-qidx"></div><div class="q-icon-block" id="${key}-icon"></div><div class="question-text" id="${key}-q"></div><div id="${key}-opt"></div></div><div class="tip-box" id="${key}-tip">${tip}</div>${key==="vocab"||key==="engsent"?`<div class="game-actions" style="margin-top:12px"><button class="choice-btn" id="${key}-assessment-btn" type="button" style="display:none">模擬9月評估</button></div>`:""}</section>`}
    document.getElementById("subject-panels").innerHTML=Object.keys(SUBJECTS).map(subjectPanel).join("");
    function addMistake(type,index,mode){if(!appData.globalMistake.some(x=>x.type===type&&x.index===index)){appData.globalMistake.push({type,index,mode:mode||null});saveStorage();updateGameUnlock()}}
    function updateSubjectStats(key,s){document.getElementById(`${key}-day`).textContent=Math.min(s.day,TOTAL_DAY);document.getElementById(`${key}-today`).textContent=s.todayDone;renderCheckin(`${key}-checkin`,s.day-1);if((key==="vocab"||key==="engsent")&&s.assessmentUnlocked&&!s.assessmentMode){const btn=document.getElementById(`${key}-assessment-btn`);if(btn){btn.style.display="inline-flex";btn.onclick=()=>startAssessment(key)}}}

    function digitMemoryGame(root){const digits=Array.from({length:4},()=>Math.floor(Math.random()*9)+1);root.innerHTML=gameShell(`<h3 id="digit-prompt">請記住數字：<strong>${digits.join("　")}</strong></h3><div id="digit-options" class="memory-options" style="display:none"></div>`);setTimeout(()=>{document.getElementById("digit-prompt").textContent="按順序點擊剛才的數字";const box=document.getElementById("digit-options");box.style.display="grid";let pos=0;shuffle([...new Set([...digits,...[1,2,3,4,5,6,7,8,9]])]).slice(0,9).forEach(n=>{const b=document.createElement("button");b.className="choice-btn";b.textContent=n;b.onclick=()=>{if(n===digits[pos]){b.disabled=true;pos++;if(pos===digits.length)finishGame("數字記得很準！繼續發光吧✨")}else{pos=0;document.querySelectorAll("#digit-options button").forEach(x=>x.disabled=false);document.getElementById("game-message").textContent="再想一次，按照順序點擊喔！"}};box.appendChild(b)})},1800)}
    function patternGame(root){const shapes=["●","▲","■","●","▲"],answer="■";root.innerHTML=gameShell(`<h3>看規律：${shapes.join("　")}　？</h3><div class="memory-options" id="pattern-options"></div>`);["●","▲","■","★"].forEach(x=>{const b=document.createElement("button");b.className="choice-btn";b.textContent=x;b.onclick=()=>x===answer?finishGame("答對啦！你是規律小高手✨"):document.getElementById("game-message").textContent="再看一次前面的順序喔！";document.getElementById("pattern-options").appendChild(b)})}
    function reactionGame(root){root.innerHTML=gameShell(`<p>看到星星就快點擊！一共 5 顆⭐</p><svg id="reaction-svg" viewBox="0 0 320 180"><rect width="320" height="180" rx="18" fill="#102a56"/><text id="reaction-star" x="160" y="95" text-anchor="middle" font-size="44" style="cursor:pointer">⭐</text></svg>`);let score=0;const star=document.getElementById("reaction-star");const move=()=>{star.setAttribute("x",30+Math.random()*260);star.setAttribute("y",50+Math.random()*100)};star.onclick=()=>{score++;if(score>=5)finishGame("反應超快！奧特曼為你歡呼🎉");else{document.getElementById("game-message").textContent=`已接到 ${score}/5 顆星！`;move()}};move()}
    const FOCUS_GAMES=[
      {name:"找不同",group:"視覺搜尋",kind:"difference",icon:"🔎"},{name:"大海撈針",group:"視覺搜尋",kind:"hidden",icon:"🌊"},
      {name:"局部拼圖",group:"視覺搜尋",kind:"puzzle",icon:"🧩"},{name:"物品歸納分類",group:"邏輯分類",kind:"sort",icon:"🧺"},
      {name:"水流顏色排序",group:"邏輯分類",kind:"water",icon:"💧"},{name:"積木歸位",group:"邏輯分類",kind:"blocks",icon:"🧱"},
      {name:"兒童汽車迷宮",group:"路線規劃",kind:"car",icon:"🚗"},{name:"管道連接",group:"路線規劃",kind:"pipe",icon:"🔧"},
      {name:"數字連線",group:"路線規劃",kind:"numbers",icon:"1️⃣"},{name:"翻牌消消樂",group:"記憶配對",kind:"pairs",icon:"🃏"},
      {name:"音樂節拍記憶",group:"記憶配對",kind:"rhythm",icon:"🎵"},{name:"順序點亮方塊",group:"記憶配對",kind:"lights",icon:"💡"},
      {name:"推箱子",group:"物理益智",kind:"box",icon:"📦"},{name:"平衡力挑戰",group:"物理益智",kind:"balance",icon:"⚖️"}
    ];
    function focusShell(title,instruction,content){return `<div class="game-stage"><h3>${title}</h3><p>${instruction}</p>${content}<div class="game-message" id="focus-message"></div><button type="button" class="choice-btn" style="margin-top:12px" onclick="renderGame()">返回遊戲列表</button></div>`}
    function focusMessage(text){const el=document.getElementById("focus-message");if(el)el.textContent=text}
    function focusButton(text,handler){const b=document.createElement("button");b.type="button";b.className="choice-btn";b.textContent=text;b.onclick=handler;return b}
    function renderGame(){const root=document.getElementById("game-content");if(!root)return;updateGameUnlockDisplay();if(window.activeFocusGame){renderFocusGame(root,window.activeFocusGame);return}root.innerHTML=`<div class="game-actions" style="justify-content:flex-start;align-items:stretch;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">${FOCUS_GAMES.map((game,index)=>{const unlocked=index<appData.unlockGameCount;return `<button type="button" class="choice-btn" style="text-align:left;min-height:94px;opacity:${unlocked?1:.55};filter:${unlocked?"none":"grayscale(1)"}" ${unlocked?`data-game-index="${index}"`:"disabled"}>${unlocked?game.icon:"🔒"} ${game.name}<small style="display:block;margin-top:6px;font-size:13px">${unlocked?game.group:"🔒完成更多錯題練習來解鎖"}</small></button>`}).join("")}</div>`;root.querySelectorAll("[data-game-index]").forEach(button=>button.onclick=()=>{window.activeFocusGame=Number(button.dataset.gameIndex);renderGame()})}
    function updateGameUnlockDisplay(){const count=document.getElementById("unlock-game-count"),complete=document.getElementById("mistake-practice-count");if(count)count.textContent=Math.min(Number(appData.unlockGameCount)||0,FOCUS_GAMES.length);if(complete)complete.textContent=Number(appData.mistakePracticeCompleteCount)||0}
    function renderFocusGame(root,index){const game=FOCUS_GAMES[index];root.innerHTML="";const content=document.createElement("div");root.appendChild(content);if(game.kind==="difference")focusDifference(content);if(game.kind==="hidden")focusHidden(content);if(game.kind==="puzzle")focusPuzzle(content);if(game.kind==="sort")focusSort(content);if(game.kind==="water")focusWater(content);if(game.kind==="blocks")focusBlocks(content);if(game.kind==="car")focusCar(content);if(game.kind==="pipe")focusPipe(content);if(game.kind==="numbers")focusNumbers(content);if(game.kind==="pairs")focusPairs(content);if(game.kind==="rhythm")focusRhythm(content);if(game.kind==="lights")focusLights(content);if(game.kind==="box")focusBox(content);if(game.kind==="balance")focusBalance(content)}
    function focusFrame(title,instruction,html){return `<div class="game-stage"><h3>${title}</h3><p>${instruction}</p>${html}<div class="game-message" id="focus-message"></div><button type="button" class="choice-btn" style="margin-top:12px" onclick="window.activeFocusGame=null;renderGame()">返回遊戲列表</button></div>`}
    function mountFocus(root,html){root.innerHTML=html;return root.querySelector(".game-stage")}
    function focusDifference(root){const spots=[1,4,7,10,13],stage=mountFocus(root,focusFrame("找不同","找出兩幅圖中的 5 處不同！",`<div class="memory-options" id="diff-grid">${Array.from({length:15},(_,i)=>`<button class="choice-btn" data-diff="${spots.includes(i)}">⭐</button>`).join("")}</div>`));let found=0;stage.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{if(b.dataset.diff==="true"&&!b.disabled){b.disabled=true;b.textContent="✅";found++;if(found===5)finishFocus("找齊 5 處不同，眼睛真利害！")}})}
    function focusHidden(root){const target="澤塔";const icons=["⭐","🚀","🟦","🌟","🟥","🔺","🟡","🟣","⚡"];const stage=mountFocus(root,focusFrame("大海撈針","找出全部 3 個澤塔奧特曼圖標！",`<div class="memory-options" id="hidden-grid">${icons.map((x,i)=>`<button class="choice-btn" data-hidden="${i%3===0}">${i%3===0?"⚡":x}</button>`).join("")}</div>`));let found=0;stage.querySelectorAll("[data-hidden]").forEach(b=>b.onclick=()=>{if(b.dataset.hidden==="true"&&!b.disabled){b.disabled=true;b.textContent="✅";found++;if(found===3)finishFocus("全部目標都找到了！")}})}
    function focusPuzzle(root){const answer=["🟥","🟦","🟨","🟩"],stage=mountFocus(root,focusFrame("局部拼圖","依次點擊 1、2、3、4，把四塊拼回去。",`<div class="memory-options" id="puzzle-grid">${shuffle(answer).map(x=>`<button class="choice-btn">${x}</button>`).join("")}</div>`));let next=0;stage.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.textContent===answer[next]){b.disabled=true;next++;if(next===4)finishFocus("拼圖完成！") }else focusMessage("再想一想第一塊是哪一塊喔")})}
    function focusSort(root){const items=[["✏️","文具"],["⚽","玩具"],["🧸","玩具"],["📏","文具"]],stage=mountFocus(root,focusFrame("物品歸納分類","點擊物品，再點擊正確籃子。",`<div id="sort-items" class="memory-options">${items.map((x,i)=>`<button class="choice-btn" data-item="${i}">${x[0]}</button>`).join("")}</div><div class="game-actions"><button class="choice-btn" data-bin="文具">📚 文具籃</button><button class="choice-btn" data-bin="玩具">🧸 玩具籃</button></div>`));let selected=null,done=0;stage.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>selected=b);stage.querySelectorAll("[data-bin]").forEach(b=>b.onclick=()=>{if(selected&&items[Number(selected.dataset.item)][1]===b.dataset.bin){selected.disabled=true;selected=null;done++;if(done===items.length)finishFocus("分類全部正確！") }else focusMessage("這件物品應該放在哪個籃子呢？")})}
    function focusWater(root){const goal=["🔴","🔵","🟢"],stage=mountFocus(root,focusFrame("水流顏色排序","依照紅、藍、綠的順序點擊水管。",`<div class="memory-options">${shuffle(goal).map(x=>`<button class="choice-btn" data-color="${x}">${x}</button>`).join("")}</div>`));let n=0;stage.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>b.dataset.color===goal[n]?(b.disabled=true,n++,n===3&&finishFocus("水流排序完成！")):focusMessage("順序是紅、藍、綠喔！"))}
    function focusBlocks(root){const shapes=["●","▲","■"],stage=mountFocus(root,focusFrame("積木歸位","把三種積木放進相同形狀凹槽。",`<div class="memory-options">${shuffle(shapes).map(x=>`<button class="choice-btn" data-shape="${x}">${x}</button>`).join("")}</div><p>凹槽順序：● ▲ ■</p>`));let n=0;stage.querySelectorAll("[data-shape]").forEach(b=>b.onclick=()=>b.dataset.shape===shapes[n]?(b.disabled=true,n++,n===3&&finishFocus("積木全部歸位！")):focusMessage("看看凹槽的形狀喔！"))}
    function focusCar(root){const path=["⬆️","➡️","➡️","⬇️"],stage=mountFocus(root,focusFrame("兒童汽車迷宮","使用方向按鈕，依路線到達終點。",`<div class="memory-options">${["⬆️","⬇️","⬅️","➡️"].map(x=>`<button class="choice-btn" data-move="${x}">${x}</button>`).join("")}</div>`));let n=0;stage.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>b.dataset.move===path[n]?(n++,n===path.length&&finishFocus("汽車到達終點！")):focusMessage("撞到牆了，再試一次！"))}
    function focusPipe(root){const stage=mountFocus(root,focusFrame("管道連接","點擊 3 次旋轉管道，接通起點和終點。",`<div class="memory-options">${[0,1,2].map(i=>`<button class="choice-btn" data-pipe="${i}">╋</button>`).join("")}</div>`));let n=0;stage.querySelectorAll("[data-pipe]").forEach(b=>b.onclick=()=>{b.textContent="━";n++;if(n===3)finishFocus("管道接通了！")})}
    function focusNumbers(root){const stage=mountFocus(root,focusFrame("數字連線","依次點擊 1、2、3、4、5。",`<div class="memory-options">${shuffle([1,2,3,4,5]).map(n=>`<button class="choice-btn" data-number="${n}">${n}</button>`).join("")}</div>`));let n=1;stage.querySelectorAll("[data-number]").forEach(b=>b.onclick=()=>Number(b.dataset.number)===n?(b.disabled=true,n++,n===6&&finishFocus("數字連線完成！")):focusMessage("要按照數字順序喔！"))}
    function focusPairs(root){const values=["⭐","⭐","🌙","🌙","⚡","⚡"],stage=mountFocus(root,focusFrame("翻牌消消樂","找出 3 對相同圖案。",`<div class="memory-options">${shuffle(values).map(x=>`<button class="choice-btn" data-pair="${x}">❓</button>`).join("")}</div>`));let first=null,matched=0;stage.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{if(b.disabled)return;b.textContent=b.dataset.pair;if(!first){first=b;return}if(first!==b&&first.dataset.pair===b.dataset.pair){first.disabled=true;b.disabled=true;matched++;first=null;if(matched===3)finishFocus("配對全部成功！")}else{const old=first;first=null;setTimeout(()=>{old.textContent="❓";b.textContent="❓"},500)}})}
    function focusRhythm(root){const seq=shuffle([0,1,2,3]),stage=mountFocus(root,focusFrame("音樂節拍記憶","記住閃光順序，再照順序點擊。",`<div class="memory-options">${seq.map((_,i)=>`<button class="choice-btn" data-rhythm="${i}">${i+1}</button>`).join("")}</div>`));let n=0;const buttons=[...stage.querySelectorAll("[data-rhythm]")];setTimeout(()=>buttons.forEach((b,i)=>setTimeout(()=>b.style.background="#ffd85a",i*350)),300);buttons.forEach(b=>b.onclick=()=>Number(b.dataset.rhythm)===seq[n]?(b.style.background="#baf0cc",n++,n===4&&finishFocus("節拍記憶成功！")):focusMessage("節拍順序不對，再試一次。"))}
    function focusLights(root){const seq=shuffle([0,1,2,3,4]),stage=mountFocus(root,focusFrame("順序點亮方塊","記住方塊閃光順序，再重現一次。",`<div class="memory-options">${seq.map((_,i)=>`<button class="choice-btn" data-light="${i}">${i+1}</button>`).join("")}</div>`));let n=0;const buttons=[...stage.querySelectorAll("[data-light]")];setTimeout(()=>buttons.forEach((b,i)=>setTimeout(()=>b.style.background="#ffd85a",i*280)),300);buttons.forEach(b=>b.onclick=()=>Number(b.dataset.light)===seq[n]?(b.style.background="#baf0cc",n++,n===5&&finishFocus("順序點亮成功！")):focusMessage("再記一次剛才的順序。"))}
    function focusBox(root){const path=["⬆️","➡️","⬇️","➡️"],stage=mountFocus(root,focusFrame("推箱子","依次使用方向，把箱子推到目標。",`<div class="memory-options">${["⬆️","⬇️","⬅️","➡️"].map(x=>`<button class="choice-btn" data-box="${x}">${x}</button>`).join("")}</div>`));let n=0;stage.querySelectorAll("[data-box]").forEach(b=>b.onclick=()=>b.dataset.box===path[n]?(n++,n===path.length&&finishFocus("箱子到達目標！")):focusMessage("這一步要小心推喔！"))}
    function focusBalance(root){const stage=mountFocus(root,focusFrame("平衡力挑戰","選擇重量，讓天平保持平衡。",`<div class="memory-options">${[1,2,3,4].map(n=>`<button class="choice-btn" data-weight="${n}">${n} ⭐</button>`).join("")}</div>`));stage.querySelectorAll("[data-weight]").forEach(b=>b.onclick=()=>Number(b.dataset.weight)===2?finishFocus("天平平衡成功！"):focusMessage("再試試另一個重量。"))}
    function finishFocus(message){showFeedback("success",()=>{window.activeFocusGame=null;renderGame()});focusMessage(message||"太棒啦！");}
    document.getElementById("feedback-close").addEventListener("click",closeFeedback);document.getElementById("feedback-layer").addEventListener("click",event=>{if(event.target.id==="feedback-layer")closeFeedback()});document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));btn.classList.add("active");const target=document.getElementById(btn.dataset.target);target.classList.add("show");if(btn.dataset.target==="tab-all-mistake")renderAllMistake();if(btn.dataset.target==="tab-game")renderGame()}));
    document.getElementById("allmistake-clear").addEventListener("click",()=>{if(appData.globalMistake.length&&confirm("確定要清空全部錯題本？")){appData.globalMistake=[];mistakeCursor=0;saveStorage();renderAllMistake()}});document.getElementById("reset-all-progress").addEventListener("click",()=>{if(confirm("確定要重置全部練習進度？所有打卡、錯題記錄將全部清除，無法復原！")){localStorage.removeItem(STORAGE_KEY);location.reload()}});
    async function loadQuizData(){try{const response=await fetch("quiz-data.json",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();const required=["ultramanKnowledge","ultramanImageQuiz","chinese","math","vocab","engsent","mandarin"];if(required.some(k=>!Array.isArray(data[k])||data[k].length!==30))throw new Error("題庫格式錯誤");const hasStoredData=Boolean(localStorage.getItem(STORAGE_KEY));if(hasStoredData&&appData.version!==data.version){alert("題庫已更新，將重置全部練習記錄。");appData=getDefaultData()}appData.version=data.version||"2.1.0";quizData=data;quizDataReady=true;saveStorage();renderAllSubjects();renderAllMistake();updateGameUnlock()}catch(error){console.error("題庫載入失敗：",error);document.querySelectorAll(".question-text").forEach(el=>el.textContent="題庫載入失敗，請以網站伺服器開啟頁面。")}};loadQuizData();
  </script>
